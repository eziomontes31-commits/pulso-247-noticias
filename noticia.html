<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/styles.css"><title>Noticia | Pulso 247</title></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">P<span>247</span></span><span class="brand-name">PULSO <b>247</b><small>NOTICIAS</small></span></a><a class="admin-link" href="/">← Volver a portada</a></header><main class="wrap" style="max-width:850px;padding-block:45px 80px"><div id="article"><p>Cargando noticia…</p></div></main><footer class="site-footer"><div class="wrap footer-inner"><span>© Pulso 247 Noticias</span><a href="/">Volver al inicio</a></div></footer><script src="/config.js"></script><script>
(async()=>{const el=document.getElementById('article'),c=window.PULSO_CONFIG||{},id=new URLSearchParams(location.search).get('id');const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));if(!id||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY||c.SUPABASE_ANON_KEY.includes('PEGA_AQUI')||c.SUPABASE_URL.includes('TU-PROYECTO')){el.innerHTML='<h1>Noticia no disponible</h1><p>Verifica el enlace o configura la conexión de noticias.</p>';return;}try{const r=await fetch(c.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/articles?select=*&id=eq.'+encodeURIComponent(id)+'&status=eq.published',{headers:{apikey:c.SUPABASE_ANON_KEY,Authorization:'Bearer '+c.SUPABASE_ANON_KEY}});const a=(await r.json())[0];if(!r.ok||!a)throw Error();document.title=a.title+' | Pulso 247 Noticias';el.innerHTML='<p class="eyebrow">'+esc(a.region)+' · '+esc(a.category)+'</p><h1 style="font:800 clamp(30px,5vw,48px)/1.12 Manrope;color:#101d33">'+esc(a.title)+'</h1><p style="font-size:18px;color:#657184">'+esc(a.summary)+'</p>'+(a.image_url?'<img src="'+esc(a.image_url)+'" alt="" style="width:100%;max-height:460px;object-fit:cover;border-radius:7px;margin:15px 0">':'')+'<p class="small-note">Por '+esc(a.author||'Redacción Pulso 247')+' · '+esc(a.location||'')+' · '+esc(a.published_at?new Date(a.published_at).toLocaleString('es-CO'):'')+'</p><div style="font-size:16px;line-height:1.85;white-space:pre-wrap">'+esc(a.body)+'</div>'+(Array.isArray(a.sources)&&a.sources.length?'<h3>Fuentes consultadas</h3><ul>'+a.sources.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')+'<p style="margin-top:35px"><a class="button button-outline" href="/">← Volver a las noticias</a></p>';}catch{el.innerHTML='<h1>No se pudo cargar la noticia</h1><p>Puede que el enlace no exista o que la noticia ya no esté publicada.</p>';}})();
</script></body></html>
